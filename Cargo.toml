[package]
name = "openai"
version = "0.6.0"
edition = "2024"
license = "MIT"
description = "Strictly typed bindings for the OpenAI Responses API, built so that an uncacheable or API-refused request cannot be constructed, nor an unfinished stream read as a finished response."
repository = "https://github.com/mariogeiger/openai"
keywords = ["openai", "responses", "prompt-caching", "streaming", "bindings"]
categories = ["api-bindings"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
